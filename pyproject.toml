[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitkit"
version = "0.1.0"
description = "Orbital mechanics toolkit: Lambert solver, trajectory propagator, and porkchop plot generator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Quaid Garton" }
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "plotly",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ipykernel",
]

[tool.setuptools.packages.find]
where = ["src"]
